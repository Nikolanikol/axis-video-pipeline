<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KOK">
<!-- Графический знак «( ● )» из брендбука (в пакете логотипов его нет — нарисован по листу).
     Точка — та же, что в знаке «◉» (r 50, центр 160), скобки — дуги одной окружности r 110
     с круглыми концами, как штрихи букв К в логотипе -->
<g fill="none" stroke="#F7F2EB" stroke-width="40" stroke-linecap="round">
  <path d="M89.3 75.7 A110 110 0 0 0 89.3 244.3"/>
  <path d="M230.7 75.7 A110 110 0 0 1 230.7 244.3"/>
</g>
<circle cx="160" cy="160" r="50" fill="#8E0D2C"/>
</svg>
