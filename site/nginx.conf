# Витрина KOK за прокси Coolify (Traefik): HTTPS и www → корень делает прокси, здесь — только файлы.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Перенаправления относительными адресами: снаружи https и чужое имя хоста, а nginx видит http:80
  absolute_redirect off;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Старый магазин фар (до 17.11 на этом домене): товаров больше нет и замены им нет — 410 «удалено
  # навсегда», чтобы поисковики быстро убрали страницы. Массовый 301 на главную Google считает
  # «мягким 404» (решение 17.11, docs/projects/site/decisions.md). Адресам с внешними ссылками
  # 301 добавляется здесь же, выше этого правила, — по выгрузке из Search Console.
  location ^~ /headlights/ { return 410; }
  error_page 404 /404.html;
  error_page 410 /404.html;

  # Скрипты и стили Astro — с хэшем в имени: кэш на год
  location /_astro/ { expires 1y; }
  # Логотипы, образцы роликов и КП — без хэша: сутки
  location ~ ^/(shared|offer)/ { expires 1d; }
  location / {
    expires 5m;
    try_files $uri $uri/ =404;
  }
}
